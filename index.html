<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>specdog — Feed the dog. Ship with specs.</title>
<meta name="description" content="CLI tool for structured software specs. Validate .dog files, compile .dag graphs, query via MCP.">
<link rel="llms-txt" href="/llms.txt">
<link rel="icon" type="image/svg+xml" href="/dotdog/assets/dog.svg">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "specdog",
  "url": "https://specdog.github.io",
  "sameAs": ["https://github.com/specdog", "https://www.npmjs.com/package/dotdog"]
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff; color: #1a1a2e;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  main { max-width: 520px; text-align: center; }
  svg { width: 100px; height: 100px; transition: transform .15s; }
  h1 { font-size: 2.4em; font-weight: 700; margin: 12px 0 4px; }
  p.tagline { color: #6b7280; font-size: 1.1em; margin-bottom: 4px; }
  p.desc { color: #4b5563; font-size: 0.92em; margin-bottom: 16px; line-height: 1.6; }
  .dog-widget { display: inline-block; cursor: pointer; user-select: none; margin-bottom: 8px; }
  #dog-status { font-size: .75em; color: #9ca3af; min-height: 18px; margin: 4px 0; }
  .actions { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .actions button { padding: 4px 12px; border-radius: 14px; border: 1px solid #e5e7eb; background: #fff; color: #4b5563; font-size: .78em; cursor: pointer; font-family: inherit; }
  .actions button:hover { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
  pre { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 14px 18px; text-align: left; font-size: .85em; color: #1e293b; margin-bottom: 20px; overflow-x: auto; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 10px 22px; border-radius: 6px; font-size: .92em; font-weight: 600; text-decoration: none; }
  a.primary { background: #f59e0b; color: #1a1a2e; }
  a.primary:hover { background: #d97706; }
  a.secondary { background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; }
  a.secondary:hover { background: #e2e8f0; }
  .line { transition: opacity .15s; }
  .cmd { color: #93c5fd; }
  .out { color: #86efac; }
  footer { margin-top: 24px; color: #9ca3af; font-size: .8em; }
  footer a { color: #9ca3af; }
</style>
</head>
<body>
<main>
  <div class="dog-widget" title="Feed the dog">
    <svg id="dog-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <ellipse cx="28" cy="28" rx="13" ry="17" fill="#d97706" transform="rotate(-15 28 28)"/>
      <ellipse cx="92" cy="28" rx="13" ry="17" fill="#d97706" transform="rotate(15 92 28)"/>
      <circle cx="60" cy="63" r="32" fill="#f59e0b"/>
      <circle cx="46" cy="56" r="5" fill="#1a1a2e"/><circle cx="74" cy="56" r="5" fill="#1a1a2e"/>
      <circle cx="48" cy="54" r="2" fill="#fff"/><circle cx="76" cy="54" r="2" fill="#fff"/>
      <ellipse cx="60" cy="70" rx="7" ry="5" fill="#1a1a2e"/>
      <path d="M52 78 Q60 86 68 78" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
      <ellipse id="tongue" cx="60" cy="84" rx="5" ry="6" fill="#ef4444" opacity="0" style="transition:opacity .2s"/>
      <g id="bone" opacity="0"><path d="M44 80 Q44 70 55 76 L65 76 Q76 70 76 80 Q76 90 65 86 L55 86 Q44 90 44 80 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/></g>
    </svg>
  </div>
  <div id="dog-status">🐕 Spec</div>
  <div class="actions">
    <button onclick="feed()">🦴 Feed</button>
    <button onclick="pet()">✋ Pet</button>
    <button onclick="fetchBall()">🎾 Fetch</button>
  </div>

  <h1>specdog</h1>
  <p class="tagline">Feed the dog. Ship with specs.</p>
  <p class="desc">CLI tool for structured software specs. Write <code>.dog</code> specs, compile to <code>.dag</code> graphs, query via MCP.</p>
  <div style="position:relative;display:inline-block;background:#1e1e2e;border-radius:6px;padding:10px 36px 10px 14px;margin-bottom:16px"><code style="color:#cdd6f4;font-size:.85em">npm install -g dotdog</code><button onclick="copyInstall()" style="position:absolute;top:50%;right:8px;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;display:flex;border-radius:4px" title="Copy"><svg id="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6c7086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div>
  <div class="try-section" style="margin-bottom:20px">
    <p style="font-size:.85em;color:#6b7280;margin-bottom:8px">See what dotdog does — no install needed</p>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px">
      <input id="repo-input" type="text" placeholder="Enter a project name" style="padding:10px 14px;border:1px solid #cbd5e1;border-radius:6px;font-size:.9em;width:200px;font-family:monospace">
      <button onclick="tryRepo()" style="padding:10px 18px;background:#f59e0b;color:#1a1a2e;border:none;border-radius:6px;font-size:.9em;font-weight:600;cursor:pointer;font-family:inherit">🐕 Test it</button>
    </div>
    <div id="try-result" style="margin-top:8px;min-height:24px"></div>
  </div>

  <div class="btns">
    <a class="btn primary" href="/dotdog">Get Started</a>
    <a class="btn secondary" href="https://www.npmjs.com/package/dotdog">npm</a>
    <a class="btn secondary" href="https://github.com/specdog/dotdog">GitHub</a>
  </div>
  <footer>dotdog@<span id="version">0.5.0</span> · <a href="https://github.com/specdog/dotdog/blob/main/LICENSE">MIT</a></footer>
</main>
<script>
const svg=document.getElementById('dog-svg'),st=document.getElementById('dog-status');
const bone=document.getElementById('bone'),tongue=document.getElementById('tongue');
function feed(){bone.setAttribute('opacity','1');st.innerHTML='🦴 Dog fed. Ship with specs!';setTimeout(()=>bone.setAttribute('opacity','0'),1500);}
function pet(){tongue.setAttribute('opacity','1');svg.style.transform='rotate(-5deg)';st.innerHTML='✋ Good dog.';setTimeout(()=>{svg.style.transform='';tongue.setAttribute('opacity','0');},800);}
function fetchBall(){svg.style.transform='translateX(20px)';st.innerHTML='🎾 Fetch!';setTimeout(()=>svg.style.transform='',400);}
svg.parentElement.addEventListener('click',feed);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='v')feed();if(e.key==='c')fetchBall();if(e.key==='p')pet();});
let typingTimer;
function tryRepo(){clearTimeout(typingTimer);const r=document.getElementById('repo-input').value.trim();const el=document.getElementById('try-result');if(!r){el.innerHTML='Enter a name like <code>my-app</code>';return;}const n=r.split('/').pop();const T='<pre style="background:#1a1a2e;color:#e2e8f0;padding:16px;border-radius:8px;font-size:.78em;line-height:2;text-align:left;margin:0 auto;max-width:440px">';const steps=[['<span style="color:#93c5fd">$ dotdog init '+n+'</span>','  <span style="color:#86efac">'+n+' — 7 .dog files created</span>','<span style="color:#9ca3af;font-size:.75em">  Defines entities, screens, user stories</span>'],['<span style="color:#93c5fd">$ dotdog validate</span>','  <span style="color:#86efac">'+n+' — 100% complete</span>','<span style="color:#9ca3af;font-size:.75em">  No gaps. Spec is production-ready.</span>'],['<span style="color:#93c5fd">$ dotdog compile</span>','  <span style="color:#86efac">\u2713 '+n+'.dag  (94% smaller)</span>','<span style="color:#9ca3af;font-size:.75em">  AI agents load exact data, not prose.</span>'],['<span style="color:#93c5fd">$ dotdog serve</span>','  <span style="color:#86efac">MCP server running on stdio</span>','<span style="color:#9ca3af;font-size:.75em">  Agents query via getEntity, traverse, search</span>'],['','<br><a href="/dotdog" class="btn primary" style="font-size:.85em">Get Started \u2192</a>','']];el.innerHTML=T+steps.map(s=>'<div class="line" style="opacity:0;height:0;overflow:hidden;transition:all .3s">'+s[0]+'<br>'+s[1]+'<br>'+s[2]+'</div>').join('')+'</pre>';let i=0;function show(){if(i<steps.length){const d=document.querySelectorAll('.line')[i];d.style.opacity='1';d.style.height='auto';i++;typingTimer=setTimeout(show,i===1?100:600);}}show();}

function copyInstall(){navigator.clipboard.writeText('npm install -g dotdog');const i=document.getElementById('copy-icon');i.innerHTML='<polyline points="20 6 9 17 4 12" stroke="#a6e3a1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';setTimeout(()=>i.innerHTML='<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',2000)}
async function loadVersion(){try{const r=await fetch('https://registry.npmjs.org/dotdog/latest');const d=await r.json();document.getElementById('version').textContent=d.version;}catch(e){}}
loadVersion();
</script>
</body>
</html>
